# CI: deterministic checks + live-site monitor (no LLM cost, no secrets needed)
#
# Adapted from docs/agents/ci-agents.yml.orig for THIS repo's reality:
# Next.js 15 + Prisma/MySQL on Vercel (Git integration deploys; no Netlify step),
# content lives in the database via /admin (no data/*.json, so no ajv step).
# Agent docs (human/subagent-run, not CI-executed): docs/agents/*.md

name: CI and Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # nightly audit, 2am UTC
    - cron: '*/30 * * * *' # uptime check every 30 min

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule' || github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck (same gate as the Vercel build)
        run: npx tsc --noEmit
      - name: Dependency audit (advisory only — known postcss/next items need breaking next@16, tracked in docs/PROJECT_CONTEXT.md)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  header-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Required security headers on the live site
        run: |
          HEADERS=$(curl -sI https://www.comforthomepg.in)
          for h in "x-content-type-options" "x-frame-options" "referrer-policy" "strict-transport-security" "permissions-policy"; do
            echo "$HEADERS" | grep -qi "$h" || { echo "Missing header: $h"; exit 1; }
          done

  uptime:
    if: github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Homepage returns 200 quickly
        run: |
          OUT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 20 https://www.comforthomepg.in)
          echo "Result: $OUT"
          CODE=$(echo "$OUT" | cut -d' ' -f1)
          [ "$CODE" = "200" ] || { echo "Site returned $CODE"; exit 1; }
